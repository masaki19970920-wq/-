<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>BLACK RABBIT v0.1</title><style>
:root{--bg:#09090c;--panel:#15151b;--text:#f7f7fb;--muted:#aaaab5;--accent:#e34b64;--line:#292932}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#24131a 0,#0a0a0e 42%,#050507 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;min-height:100dvh}.app{width:min(100%,480px);min-height:100dvh;margin:auto;background:rgba(5,5,8,.72);padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}.screen{display:none;min-height:100dvh;padding:34px 0}.screen.active{display:flex;flex-direction:column}.title{margin:auto 0;text-align:center}.logo{font-size:42px;font-weight:900;letter-spacing:.08em}.sub{color:var(--muted);margin:8px 0 30px}.btn{width:100%;border:1px solid var(--line);background:#18181f;color:#fff;border-radius:14px;padding:15px;margin:6px 0;font-size:16px}.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:800}.btn:disabled{opacity:.35}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.label{font-size:13px;color:var(--muted);margin:10px 0 6px}input,select{width:100%;background:#0e0e13;color:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px}.row{display:flex;gap:10px}.row>*{flex:1}.head{font-size:25px;font-weight:850;margin-bottom:8px}.story{font-size:17px;line-height:2;white-space:pre-line}.date{font-size:14px;color:#d8aab2;letter-spacing:.06em}.money{font-size:24px;font-weight:800}.cast{padding:10px 0;border-bottom:1px solid var(--line)}.tiny{font-size:12px;color:var(--muted)}.spacer{flex:1}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:999px;display:none}.choice{background:#101016;border:1px solid #33333d;text-align:left}.home-actions{margin-top:18px}.tag{display:inline-block;background:#24242c;border-radius:999px;padding:5px 9px;font-size:12px;color:#ddd;margin:3px}
</style></head><body><main class='app'>
<section id='title' class='screen active'><div class='title'><div class='logo'>BLACK<br>RABBIT</div><div class='sub'>Concept Café Romance Simulation<br><span class='tiny'>Prototype Ver.0.1</span></div><button class='btn primary' onclick="show('setup')">NEW GAME</button><button id='continueBtn' class='btn' onclick='continueGame()'>CONTINUE</button><button class='btn' onclick="alert('設定画面は後のバージョンで実装します。')">SETTINGS</button></div></section>
<section id='setup' class='screen'><div class='head'>PLAYER SETUP</div><div class='card'><div class='label'>名前</div><input id='playerName' maxlength='12' placeholder='名前を入力'><div class='label'>誕生日</div><div class='row'><select id='birthMonth'></select><select id='birthDay'></select></div><div class='label'>難易度</div><select id='difficulty'><option value='easy'>EASY — ¥300,000</option><option value='normal' selected>NORMAL — ¥150,000</option><option value='hard'>HARD — ¥60,000</option><option value='extreme'>EXTREME — ¥15,000</option></select><p class='tiny'>難易度で恋愛の進みやすさは変わりません。主に所持金・毎月の給与が変化します。</p></div><div class='spacer'></div><button class='btn primary' onclick='confirmSetup()'>確認する</button><button class='btn' onclick="show('title')">戻る</button></section>
<section id='confirm' class='screen'><div class='head'>PLAYER DATA</div><div id='confirmData' class='card'></div><div class='spacer'></div><button class='btn primary' onclick='startGame()'>ゲーム開始</button><button class='btn' onclick="show('setup')">戻る</button></section>
<section id='prologue' class='screen'><div class='date'>4月1日</div><div class='head'>心斎橋・夜</div><div id='story' class='card story'></div><div id='choices'></div><div class='spacer'></div><button id='nextStory' class='btn primary' onclick='advanceStory()'>次へ</button></section>
<section id='home' class='screen'><div id='homeDate' class='date'></div><div class='head'>HOME</div><div class='card'><div class='tiny'>所持金</div><div id='homeMoney' class='money'></div></div><div class='card'><b>今日のBLACK RABBIT</b><div id='castList'></div></div><div class='home-actions'><button class='btn' disabled>BLACK RABBITへ行く <span class='tiny'>（Ver.0.2）</span></button><button class='btn' disabled>カレンダー</button><button class='btn' disabled>SNS</button><button class='btn' disabled>アルバム</button><button class='btn' onclick='manualSave()'>セーブ</button><button class='btn' onclick='backToTitle()'>タイトルへ</button></div></section>
</main><div id='toast' class='toast'></div><script>
const CHARACTERS=[
{id:'shio',name:'しおち',birthday:'10/07',shift:[1,2,4,6,0]},
{id:'kome',name:'こめ',birthday:'02/12',shift:[1,3,4,5,0]},
{id:'suzu',name:'スズ',birthday:'12/11',shift:[2,3,4,6,0]},
{id:'niatama',name:'にあたま',birthday:'05/21',shift:[1,3,5,6,0]}
];
const MONEY={easy:300000,normal:150000,hard:60000,extreme:15000};
let state=null,tempSetup=null,storyStep=0;
const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}
function yen(n){return '¥'+n.toLocaleString('ja-JP')}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1600)}
for(let m=1;m<=12;m++)$('birthMonth').add(new Option(m+'月',m));function fillDays(){let m=+$('birthMonth').value||1,d=new Date(2000,m,0).getDate(),old=+$('birthDay').value||1;$('birthDay').innerHTML='';for(let i=1;i<=d;i++)$('birthDay').add(new Option(i+'日',i));$('birthDay').value=Math.min(old,d)}$('birthMonth').onchange=fillDays;fillDays();
function confirmSetup(){let name=$('playerName').value.trim();if(!name)return toast('名前を入力してね');let diff=$('difficulty').value;tempSetup={name,birthMonth:+$('birthMonth').value,birthDay:+$('birthDay').value,difficulty:diff,money:MONEY[diff]};$('confirmData').innerHTML=`<p>名前：<b>${escapeHtml(name)}</b></p><p>誕生日：${tempSetup.birthMonth}月${tempSetup.birthDay}日</p><p>難易度：${diff.toUpperCase()}</p><p>初期資金：${yen(tempSetup.money)}</p>`;show('confirm')}
function startGame(){state={saveVersion:1,player:{...tempSetup},date:{year:1,month:4,day:1},money:tempSetup.money,memories:{firstVisitChoice:null,firstCast:null},dialogueHistory:[],characters:Object.fromEntries(CHARACTERS.map(c=>[c.id,{affection:0,trust:0,jealousy:0,lastTalk:null,memories:[]}]))};save('blackrabbit_auto');storyStep=0;show('prologue');renderStory()}
const STORY=[
`大阪、心斎橋。\n\n夜の街を、特に目的もなく歩いていた。\n\nさっきまで降っていた雨のせいで、アスファルトには街の明かりが滲んでいる。`,
`「……ん？」\n\nふと、見慣れない看板が目に入った。\n\n『BLACK RABBIT』\n\n黒を基調にした入口。\n何の店なのか気になって、少しだけ足を止める。`,
`エレベーターへ乗り込む。\n\nゆっくりと階数表示が変わっていく。\n\n――チン♪\n\n扉が開いた。\n\n？？？「いらっしゃいませ〜！」`,
`初めて見る店内に、少しだけ緊張する。\n\n別に、また来る約束をしたわけじゃない。\nまだ何も始まっていない。\n\nでも――BLACK RABBITという名前だけは、少し頭に残った。`,
`――4月1日 終了――\n\n翌日から、あなた自身のBLACK RABBITでの日々が始まる。`
];
function renderStory(){$('story').textContent=STORY[storyStep];$('choices').innerHTML='';$('nextStory').style.display='block';if(storyStep===1){$('nextStory').style.display='none';[['入ってみる','enter'],['ちょっと怪しいな……','wary'],['一回通り過ぎる','pass']].forEach(([t,v])=>{let b=document.createElement('button');b.className='btn choice';b.textContent=t;b.onclick=()=>{state.memories.firstVisitChoice=v;state.dialogueHistory.push('prologue_choice:'+v);storyStep++;renderStory()};$('choices').appendChild(b)})}}
function advanceStory(){if(storyStep<STORY.length-1){storyStep++;renderStory()}else{state.date={year:1,month:4,day:2};save('blackrabbit_auto');renderHome();show('home')}}
function weekdayIndex(){/* fictional calendar: Year1 Apr1=Wed */let days=0;for(let m=4;m<state.date.month;m++)days+=new Date(2000,m,0).getDate();days+=state.date.day-1;return (3+days)%7}function wdName(i){return ['日','月','火','水','木','金','土'][i]}
function renderHome(){let w=weekdayIndex();$('homeDate').textContent=`1年目 ${state.date.month}月${state.date.day}日（${wdName(w)}）`;$('homeMoney').textContent=yen(state.money);let working=CHARACTERS.filter(c=>c.shift.includes(w));$('castList').innerHTML=working.map(c=>`<div class='cast'>${c.name} <span class='tag'>出勤</span></div>`).join('')||'<div class="cast">本日の出勤情報なし</div>'}
function save(key){localStorage.setItem(key,JSON.stringify(state));$('continueBtn').disabled=false}function manualSave(){save('blackrabbit_manual_1');toast('セーブしました')}function load(key){try{let x=JSON.parse(localStorage.getItem(key));if(!x)return false;state=x;return true}catch(e){return false}}
function continueGame(){if(!load('blackrabbit_auto')&&!load('blackrabbit_manual_1'))return toast('セーブデータがありません');renderHome();show('home')}function backToTitle(){save('blackrabbit_auto');show('title')}function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('continueBtn').disabled=!localStorage.getItem('blackrabbit_auto')&&!localStorage.getItem('blackrabbit_manual_1');
</script></body></html>

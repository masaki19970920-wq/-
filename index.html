 return `<section class=\"panel jealousyPanel\"><h2>♡ ほかのキャストの反応</h2><p>今日の出来事を、少し気にしているみたい……。</p><div class=\"memoryList\">${state.lastJealousy.map(x=>`<article class=\"memory\"><img src=\"${heroImages[x.char]}\" alt=\"\"><div><b>${chars[x.char].name}</b><p>「${x.text}」</p></div></article>`).join('')}</div></section>`;
}
function nav(active){return `<div class="bottomNav"><button class="navBtn ${active==='pre'?'active':''}" data-page="pre">🏠<br>ホーム</button><button class="navBtn ${active==='shop'?'active':''}" data-page="shop">🛍<br>メニュー</button><button class="navBtn ${active==='memory'?'active':''}" data-page="memory">📖<br>思い出</button><button class="navBtn" data-page="pre">♡<br>キャスト</button><button class="navBtn" data-action="exit">🚪<br>店を出る</button></div>`}
function startPage(){return `<main class="page active"><section class="heroCard"><img src="${heroImages.shio}" alt="BLACK RABBIT"><div class="heroShade"></div><div class="heroText"><div class="eyebrow">BLACK RABBIT / CONCEPT CAFE</div><h1>近すぎる距離、特別な時間。</h1><p>あなたの名前と難易度を決めて、BLACK RABBITでの物語を始めよう。</p><input id="name" class="input" placeholder="あなたの名前" maxlength="20"><select id="difficulty" class="select"><option value="easy">ゆるめ　¥300,000</option><option value="normal" selected>普通　¥150,000</option><option value="hard">厳しめ　¥60,000</option><option value="extreme">かなり厳しい　¥15,000</option></select><button class="btn primary full" data-action="start" style="margin-top:8px">ゲームを開始する</button></div></section></main>`}
function pre(){const id=todayCast()[0];return header()+`<main class="page active"><section class="heroCard"><img src="${heroImages[id]}" alt="${chars[id].name}"><div class="heroShade"></div><div class="heroText"><div class="eyebrow">BLACK RABBIT / TONIGHT</div><h1>今日は、どうする？</h1><p>今日もBLACK RABBITがあなたを待っています。<br>少しだけ勇気を出して、特別な時間を過ごしに行きますか？</p><div class="actions"><button class="btn primary full" data-action="enter">🐰 BLACK RABBITへ行く<small>今日の出勤キャストに会いに行く</small></button><button class="btn full" data-action="skip">⌂ 今日は行かない<small>また次の機会に……</small></button></div></div></section><section class="panel"><h2>今日の出勤キャスト</h2><p>出勤中のキャストだけ選択できます。</p>${castCards()}</section>${nav('pre')}</main>`}
function shop(){const c=chars[state.selected];const rel=state.rel[state.selected];const tr=state.trust[state.selected];const line={shio:'待ってたよ…♡ 今日はどんなお話しする？',kome:'お、来たやん！今日はいっぱい笑お〜笑',suzu:'今日はちょっと甘えたい気分…♡',nia:'待ってたよ？今日もいっぱい話そ！'}[state.selected];return header()+`<main class="page active"><div class="shopGrid"><section class="character"><img src="${heroImages[state.selected]}" alt="${c.name}"><div class="dialog"><span class="speaker">${c.name}</span><div class="dialogText">${line}</div></div><div class="relation">関係：<b>${relLabel(rel)}</b>　<span class="heart">♥♥♥</span></div></section><section class="panel"><h2>店内</h2><p>${c.name}と、どんな時間を過ごす？</p><div class="statusPanel"><div class="statusRow"><div class="statusLabel">好感度</div><div class="statusTrack"><div class="statusFill" style="width:${statusWidth(rel)}%"></div></div></div><div class="statusRow"><div class="statusLabel">信頼度</div><div class="statusTrack"><div class="statusFill" style="width:${statusWidth(tr)}%"></div></div></div><div class="statusText">${trustLabel(tr)}</div><div class="hintBox">数値は表示されません。会話・メニュー・約束などの積み重ねで、少しずつ関係が変化します。</div></div><div class="actions"><button class="btn primary" data-action="talk">💬 会話する</button><button class="btn" data-page="menu">🛍 メニュー</button><button class="btn" data-action="sns">♡ SNS</button><button class="btn" data-action="promise">📅 次の約束</button><button class="btn" data-page="memory">📖 思い出</button><button class="btn" data-action="exit">🚪 店を出る</button></div><div style="margin-top:12px">${castCards()}</div></section></div>${nav('pre')}</main>`} 
function menuPage(){return header()+`<main class="page active"><section class="panel"><h2>🛍 メニュー</h2><p>${chars[state.selected].name}に何か贈る？選んだメニューによって、お礼のセリフと演出が変わります♡</p><div class="tabs"><button class="tab on">すべて</button><button class="tab">ドリンク</button><button class="tab">チェキ</button><button class="tab">シャンパン</button><button class="tab">フード</button><button class="tab">特別</button></div><div class="menuList">${menus.map(m=>`<button class="menuItem" data-buy="${m.id}"><span class="menuArt">${m.icon}</span><span><b>${m.name}</b><small>${m.cat}<br>${chars[state.selected].name}からお礼が届きます♡</small></span><span class="price">${money(m.price)}<br>›</span></button>`).join('')}</div></section>${nav('shop')}</main>`}
function reaction(){const m=menus.find(x=>x.id===state.reaction);const propClass=(m.id==='drink'||m.id==='can')?'drink':m.id==='cocktail'?'cocktail':(m.id==='champagne'||m.id==='orchamp')?'champagne':m.id==='cheki'?'cheki':m.id==='food'?'food':'gift';const gain=gainFor(state.selected,m.id);const tg=trustGainFor(state.selected,m.id);const line=reactions[state.selected][m.id];const img=reactionImages[state.selected][propClass];return header()+`<main class="page active"><section class="reactionArt reaction-${state.selected}"><img src="${img}" alt="${chars[state.selected].name}の${m.name}専用立ち絵"></section><section class="reactionBox"><span class="speaker">${chars[state.selected].name}</span><div class="dialogText">${line}</div><div class="reactionMeta"><span class="reactionTag">${m.name}</span><span class="reactionGain">♡ 好感度 +${gain}</span><span class="reactionGain">信頼 +${tg}</span></div><div class="reactionReason">${preferenceText(state.selected,m.id)}。${relLabel(state.rel[state.selected])}の距離感です。</div></section><div class="actions"><button class="btn primary full" data-page="shop">店内に戻る</button></div>${jealousyPanel()}</main>`}
function memory(){return header()+`<main class="page active"><section class="panel"><h2>📖 思い出</h2><p>一緒に過ごした時間がここに残ります。</p><div class="memoryList">${state.memories.length?state.memories.slice().reverse().map(x=>`<article class="memory"><img src="${heroImages[x.char]}" alt=""><div><b>${x.date}｜${chars[x.char].name}</b><p>${x.text}</p></div></article>`).join(''):'<div class="note">まだ思い出はありません。</div>'}</div></section>${nav('memory')}</main>`}
function result(){const arr=Object.values(state.today);const total=arr.reduce((a,x)=>a+x.spend,0);return header()+`<main class="page active"><section class="panel"><h2>🚪 今日のリザルト</h2><p>今日、誰に何をしたか。</p>${arr.length?arr.map(x=>`<article class="memory"><img src="${heroImages[x.char]}" alt=""><div><b>${chars[x.char].name}</b><p>会話 ${x.talk||0}回 / メニュー ${x.menu||0}回 / 使用 ${money(x.spend||0)}</p><small>${x.last||''}</small></div></article>`).join(''):'<div class="note">今日は誰にも会わずに帰りました。</div>'}<div class="panel"><div>今日の使用金額</div><div class="resultTotal">${money(total)}</div><div class="note">残り ${money(state.money)}</div></div><button class="btn primary full" data-action="nextday">翌日へ</button></section></main>`}
function render(page){state.page=page;const root=document.getElementById('app');root.innerHTML=page==='start'?startPage():page==='pre'?pre():page==='shop'?shop():page==='menu'?menuPage():page==='memory'?memory():page==='result'?result():reaction();window.scrollTo(0,0);bind()}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>render(b.dataset.page));document.querySelectorAll('[data-cast]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.cast;render('shop')});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action))}
function act(a){if(a==='start'){state.name=(document.getElementById('name').value||'あなた').trim();state.difficulty=document.getElementById('difficulty').value;state.money=moneyBy[state.difficulty];state.day=1;state.today={};render('pre');return}if(a==='enter'){state.today={};render('shop');return}if(a==='skip'){state.day++;state.today={};render('pre');return}if(a==='exit'){render('result');return}if(a==='nextday'){state.day++;state.today={};render('pre');return}if(a==='talk'){const t=state.today[state.selected]||{char:state.selected,spend:0,talk:0,menu:0};t.talk=(t.talk||0)+1;t.last='会話をした。少し距離が近づいた。';state.today[state.selected]=t;state.rel[state.selected]+=3;state.trust[state.selected]+=2;state.memories.push({char:state.selected,date:dateText(),text:'一緒に話した。'});render('shop');return}if(a==='sns'){state.memories.push({char:state.selected,date:dateText(),text:chars[state.selected].name+'のSNSを見た。'});render('shop');return}if(a==='promise'){state.memories.push({char:state.selected,date:dateText(),text:chars[state.selected].name+'と次に会う約束をした。'});render('shop');return}}
function buy(id){const m=menus.find(x=>x.id===id);if(!m)return;if(state.money<m.price){alert('所持金が足りません。');return}state.money-=m.price;const t=state.today[state.selected]||{char:state.selected,spend:0,talk:0,menu:0};t.spend+=m.price;t.menu++;t.last=m.name+'を贈った。';state.today[state.selected]=t;const gain=gainFor(state.selected,m.id),tg=trustGainFor(state.selected,m.id);state.rel[state.selected]=Math.min(100,state.rel[state.selected]+gain);state.trust[state.selected]=Math.min(100,state.trust[state.selected]+tg);state.memories.push({char:state.selected,date:dateText(),text:m.name+'を贈った。'+reactions[state.selected][m.id]+'（関係が少し近づいた）'});applyJealousy(state.selected);state.reaction=id;render('reaction')}
try{render('start')}catch(e){document.getElementById('app').innerHTML='<main class=\"page active\" style=\"min-height:100dvh;display:flex;align-items:center;justify-content:center\"><section class=\"panel\" style=\"width:100%;text-align:center\"><h2>BLACK RABBIT</h2><p>読み込み中にエラーが発生しました。ページを再読み込みしてください。</p></section></main>';}
</script></body></html>

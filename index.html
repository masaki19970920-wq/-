<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BLACK RABBIT UI MASTER v0.4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050407;color:#fff;font-family:"Yu Mincho",serif}button{font:inherit;color:inherit}.app{position:fixed;inset:0;margin:auto;width:min(100vw,430px);height:100dvh;overflow:hidden;background:radial-gradient(circle at 70% 15%,#5b0a18,transparent 34%),linear-gradient(145deg,#12070a,#060507 50%,#25070d)}.screen{display:none;position:absolute;inset:0;overflow:hidden;padding:max(14px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));background:linear-gradient(#0002,#0008),radial-gradient(circle at 40% 20%,#7b1422,transparent 28%),linear-gradient(145deg,#26080d,#080608 55%,#3a090f)}.screen.active{display:flex;flex-direction:column}.top{height:48px;display:grid;grid-template-columns:46px 1fr 72px;align-items:center;flex:none;z-index:2}.back,.menu{height:38px;border:1px solid #aaa;background:#070709bb;border-radius:12px}.back{width:38px;border-radius:50%;font-size:25px}.menu{font-size:12px}.title{text-align:center;font-size:23px;letter-spacing:.08em}.sub{display:block;font-size:9px;color:#ef7188;letter-spacing:.24em;margin-top:3px}.hud{display:flex;justify-content:space-between;font:13px system-ui;z-index:2}.logo{margin:auto;text-align:center;font-size:29px;letter-spacing:.08em;color:#ffd8d1;text-shadow:0 0 20px #e22}.story,.notice,.exitbox{z-index:2;border:1px solid #aaa;background:#080709dd;border-radius:12px;padding:15px 17px;line-height:1.7;font-size:14px}.story{margin-top:auto}.notice{margin:12px auto 9px;padding:9px 13px;background:#f5efec;color:#171214;border:0;font:12px/1.5 system-ui;text-align:center}.primary,.dark{z-index:2;width:100%;height:56px;margin-top:10px;border-radius:11px;border:1px solid #ff718b;background:linear-gradient(135deg,#ef3457,#a70d2c);font-size:16px}.dark{background:#08080ae8;border-color:#aaa}.castList{display:grid;grid-template-rows:repeat(4,1fr);gap:7px;min-height:0;flex:1;z-index:2}.cast{display:grid;grid-template-columns:42% 1fr 30px;min-height:0;border:1px solid #aaa;border-radius:9px;overflow:hidden;background:#070709df;padding:0}.portrait{background:radial-gradient(circle at 55% 35%,#f4b5bd 0 13%,#8d3344 31%,#1a0b10 67%)}.info{align-self:center;text-align:left;padding-left:13px}.name{font-size:19px}.status{display:inline-block;margin-top:6px;padding:3px 9px;background:#ef4261;border-radius:8px;font:10px system-ui}.arrow{align-self:center;font-size:28px}.talkart{position:absolute;inset:0 0 39%;background:radial-gradient(circle at 52% 30%,#f2bac2 0 12%,#9c4659 26%,transparent 27%),radial-gradient(circle at 50% 45%,#76131f,transparent 55%),#14090c}.dialogue{z-index:2;margin-top:auto;background:#f4efed;color:#171216;border-radius:11px;padding:12px 14px;font:13px/1.55 system-ui}.badge{background:#ef4764;color:#fff;padding:3px 12px;border-radius:8px;font-size:10px}.choices{z-index:2;display:grid;gap:5px;margin-top:7px}.choice{height:41px;border:1px solid #aaa;background:#08080aeb;border-radius:8px;text-align:left;padding:0 14px;font-size:13px}.exitbox{margin:auto 0 0;text-align:center;padding:25px 16px}.actions{z-index:2}

/* === UI MASTER v0.2 / TRUE NO-SCROLL VIEWPORT === */
html{
  width:100%;
  height:100%;
  overflow:hidden!important;
  overscroll-behavior:none;
  background:#050407;
}
body{
  position:fixed!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  min-height:0!important;
  margin:0!important;
  padding:0!important;
  overflow:hidden!important;
  overscroll-behavior:none!important;
  touch-action:none;
}
.app{
  position:fixed!important;
  inset:0!important;
  width:min(100%,430px)!important;
  height:100%!important;
  min-height:0!important;
  max-height:100%!important;
  margin:auto!important;
  overflow:hidden!important;
  overscroll-behavior:none!important;
}
.screen,
.screen.active{
  box-sizing:border-box!important;
  width:100%!important;
  height:100%!important;
  min-height:0!important;
  max-height:100%!important;
  overflow:hidden!important;
  overscroll-behavior:none!important;
}
.screen.active{
  display:flex!important;
  flex-direction:column!important;
  padding-top:max(10px,env(safe-area-inset-top))!important;
  padding-bottom:max(8px,env(safe-area-inset-bottom))!important;
}
button{touch-action:manipulation}

/* Compress vertically on shorter iPhones instead of introducing scrolling. */
@media (max-height:760px){
  .top{height:42px!important}
  .notice{margin:6px auto!important;padding:6px 10px!important;font-size:10.5px!important}
  .castList{gap:5px!important}
  .name{font-size:17px!important}
  .status{margin-top:3px!important;padding:2px 7px!important}
  .dark,.primary{height:48px!important;margin-top:6px!important}
  .story{padding:11px 14px!important;font-size:12px!important;line-height:1.55!important}
  .dialogue{padding:9px 12px!important;font-size:11.5px!important;line-height:1.4!important}
  .choices{gap:4px!important;margin-top:5px!important}
  .choice{height:35px!important;font-size:11.5px!important}
  .exitbox{padding:18px 14px!important;font-size:12px!important}
}


/* === UI MASTER v0.3 / EMBEDDED iOS VIEWPORT FIT ===
   The iOS file-preview/browser chrome is outside the CSS viewport.
   Do not add safe-area padding again inside the game viewport. */
.screen.active{
  padding:10px 14px 10px!important;
}
#entry.screen.active{
  padding-top:10px!important;
  padding-bottom:10px!important;
}
#entry .hud{
  flex:0 0 auto!important;
  height:28px!important;
  align-items:center!important;
}
#entry .logo{
  position:absolute!important;
  left:0!important;
  right:0!important;
  top:38%!important;
  transform:translateY(-50%)!important;
  margin:0!important;
}
#entry .story{
  margin-top:auto!important;
  flex:0 0 auto!important;
}
#entry .primary{
  flex:0 0 54px!important;
  height:54px!important;
  margin-top:10px!important;
  margin-bottom:0!important;
}
@media(max-height:700px){
  #entry .logo{top:34%!important;font-size:25px!important}
  #entry .story{padding:9px 13px!important;line-height:1.45!important}
  #entry .primary{height:48px!important;flex-basis:48px!important}
}


/* === UI MASTER v0.4 / VISUAL VIEWPORT LOCK ===
   Height is supplied by JS from iOS visualViewport instead of 100vh/100dvh. */
html,body{
  width:100%!important;
  height:100%!important;
  margin:0!important;
  padding:0!important;
  overflow:hidden!important;
  background:#050407!important;
}
body{position:static!important}
.app{
  position:fixed!important;
  left:50%!important;
  top:0!important;
  bottom:auto!important;
  transform:translateX(-50%)!important;
  width:min(100%,430px)!important;
  height:var(--br-vh,100vh)!important;
  min-height:0!important;
  max-height:var(--br-vh,100vh)!important;
  margin:0!important;
  overflow:hidden!important;
}
.screen,.screen.active{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  min-height:0!important;
  max-height:100%!important;
  padding:10px 14px!important;
  overflow:hidden!important;
}
/* Make the top region part of the scene, never a separate black spacer. */
#entry.screen.active{
  background:
    linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.48)),
    radial-gradient(circle at 40% 18%,#7b1422,transparent 29%),
    linear-gradient(145deg,#26080d,#080608 55%,#3a090f)!important;
}

</style></head><body><main class="app">
<section id="entry" class="screen active"><div class="hud"><span>2031/04/01 (火) ☀️</span><span>¥128,600</span></div><div class="logo">♢ BLACK RABBIT</div><div class="story">扉が開き、<br>いつものお店の景色が広がる。<br>今日もここに帰ってきた——。</div><button class="primary" onclick="go('shop')">次へ　›</button></section>
<section id="shop" class="screen"><div class="top"><button class="back" onclick="go('entry')">‹</button><div class="title">店内<span class="sub">BLACK RABBIT</span></div><button class="menu">メニュー</button></div><div class="notice">今日はこのメンバーが出勤しています<br>話したいキャストを選んでください♡</div><div class="castList">
<button class="cast" onclick="go('talk')"><div class="portrait"></div><div class="info"><div class="name">しお</div><span class="status">出勤中</span></div><div class="arrow">›</div></button>
<button class="cast" onclick="go('talk')"><div class="portrait"></div><div class="info"><div class="name">おこめ</div><span class="status">出勤中</span></div><div class="arrow">›</div></button>
<button class="cast" onclick="go('talk')"><div class="portrait"></div><div class="info"><div class="name">すず</div><span class="status">出勤中</span></div><div class="arrow">›</div></button>
<button class="cast" onclick="go('talk')"><div class="portrait"></div><div class="info"><div class="name">にあ</div><span class="status">出勤中</span></div><div class="arrow">›</div></button></div><button class="dark" onclick="go('exit')">🚪　店を出る</button></section>
<section id="talk" class="screen"><div class="talkart"></div><div class="top"><button class="back" onclick="go('shop')">‹</button><div class="title">しお</div><button class="menu">メニュー</button></div><div class="dialogue"><span class="badge">しお</span><br>——来てくれたんだ♡<br>やっぱり会えると嬉しい……<br>今日はどんな話しよっか？</div><div class="choices"><button class="choice">最近どう？</button><button class="choice">今日のイベント楽しみだね</button><button class="choice">ちょっと相談があって……</button><button class="choice">一緒に乾杯しよう！</button><button class="choice" onclick="go('shop')">また後で来るね</button></div></section>
<section id="exit" class="screen"><div class="top"><button class="back" onclick="go('shop')">‹</button><div class="title">店を出る<span class="sub">BLACK RABBIT</span></div><button class="menu">メニュー</button></div><div class="exitbox">本日はありがとうございました<br>またのご来店をお待ちしています♡</div><div class="actions"><button class="primary" onclick="go('entry')">🚪　店を出る　›</button><button class="dark" onclick="go('shop')">‹　もう少し滞在する</button></div></section>
</main><script>function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}document.addEventListener('touchmove',function(e){
  if(!e.target.closest('button')) e.preventDefault();
},{passive:false});

function lockVisualViewport(){
  const vv=window.visualViewport;
  const h=Math.round(vv ? vv.height : window.innerHeight);
  document.documentElement.style.setProperty('--br-vh',h+'px');
  const app=document.querySelector('.app');
  if(app){
    app.style.height=h+'px';
    app.style.maxHeight=h+'px';
  }
}
lockVisualViewport();
window.addEventListener('resize',lockVisualViewport,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(lockVisualViewport,80),{passive:true});
if(window.visualViewport){
  visualViewport.addEventListener('resize',lockVisualViewport,{passive:true});
  visualViewport.addEventListener('scroll',lockVisualViewport,{passive:true});
}

</script></body></html>

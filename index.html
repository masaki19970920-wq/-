function openOrder(id){if(!working().includes(id))return toast('今日は出勤していません');document.getElementById('menu').classList.add('show');let buttons=CAFE_MENU.map(x=>`<button class="btn" ${S.money<x.price?'disabled':''} onclick="confirmOrder('${id}','${x.id}')"><b>${x.name}</b>　${yen(x.price)}<br><span class="tiny">${x.note}</span></button>`).join('');document.getElementById('menuBody').innerHTML=`<div class="sectionTitle">${CHARS[id].name}に何を注文する？</div><p class="muted">所持金 ${yen(S.money)}</p><div class="choices">${buttons}</div><button class="btn ghost" onclick="closeMenu()">やめる</button>`}
function confirmOrder(id,itemId){let item=CAFE_MENU.find(x=>x.id===itemId);if(!item)return toast('メニューを読み直してください');if(S.money<item.price)return toast('所持金が足りません');S.money-=item.price;S.history.push({day:S.day,type:'order',char:id,item:item.id,price:item.price});S.mem.push('DAY '+S.day+'：'+CHARS[id].name+'に'+item.name+'を注文した');closeMenu();startTalk(id,item)}
function startTalk(id,item){convo={id,stage:0,bank:contextualBank(id),lines:[],order:item||CAFE_MENU[0],opening:openingFor(id,contextTier(id))};renderTalk()}
function talkStageData(b,stage){if(!Array.isArray(b)||!b.length)return {prompt:'何を話そう？',opts:[],reaction:''};if(stage===0){let row=b[0]||[];return {prompt:row[0]||'何を話そう？',opts:Array.isArray(row[1])?row[1]:[],reaction:''}}let row=b[stage]||[];return {prompt:row[1]||'もう少し話そう。',opts:Array.isArray(row[2])?row[2]:[],reaction:row[0]||''}}
function reactionAfterChoice(b,stage,id){let next=b[stage+1];if(Array.isArray(next)&&typeof next[0]==='string')return next[0];return {shio:'……うん。覚えとくちゃむ。',kome:'ふふ、やっぱ話してるとおもろいわ笑',suzu:'……その答え、嫌いじゃない。',nia:'ふふ。今の言葉、覚えとく。'}[id]||'……うん。'}
function renderTalk(){page('talk');let id=convo.id,stage=convo.stage,b=convo.bank,d=talkStageData(b,stage);let prompt=d.prompt,opts=d.opts;let last=convo.lines.length?convo.lines[convo.lines.length-1].reaction:(orderReaction(id,convo.order)+' '+convo.opening);if(!opts.length){console.warn('Missing talk options',id,stage);return finishTalk()}document.getElementById('talk').innerHTML=`<div class="hero"><img src="${IMG[id]}"><div class="shade"></div><div class="dialog"><div class="name">${CHARS[id].name}</div><div class="text">${esc(last)}</div></div></div><div class="panel"><span class="tag">${esc(convo.order.name)} ${yen(convo.order.price)}</span><div class="muted" style="margin-top:8px">${esc(prompt)}</div><div class="choices">${opts.map((o,i)=>`<button class="btn" onclick="pick(${i})">${esc(o[0])}</button>`).join('')}</div></div><div class="row"><button class="btn ghost" onclick="showLog()">会話ログ</button><button class="btn ghost" onclick="showMemory()">思い出</button></div>`}
function pick(i){let id=convo.id,stage=convo.stage,b=convo.bank,d=talkStageData(b,stage),opt=d.opts[i];if(!opt){console.warn('Invalid talk choice',id,stage,i);return toast('選択肢を読み直しました')}let reaction=reactionAfterChoice(b,stage,id),text=opt[0],aff=Number(opt[2])||0,trust=Number(opt[3])||0;S.rel[id].aff=Math.min(100,S.rel[id].aff+aff);S.rel[id].trust=Math.min(100,S.rel[id].trust+trust);convo.lines.push({player:text,reaction,mood:opt[1]||'normal'});S.history.push({day:S.day,type:'talkChoice',char:id,text});if(stage===1)S.mem.push(CHARS[id].name+'との会話：「'+text+'」');if(stage<2){convo.stage++;save();renderTalk()}else finishTalk()}
function finishTalk(){let id=convo.id;S.rel[id].talks++;S.lastTalk=id;S.visits++;S.history.push({day:S.day,type:'talk',char:id,order:convo.order?.id||'drink'});S.mem.push('DAY '+S.day+'：'+CHARS[id].name+'とゆっくり話した');for(const other of working())if(other!==id){S.rel[other].aff=Math.min(100,S.rel[other].aff+1);S.flags['noticed_'+other+'_'+id]=(S.flags['noticed_'+other+'_'+id]||0)+1}advanceDay();convo=null;save();renderHome()}
function advanceDay(){S.day++;S.dayOfMonth++;if(S.dayOfMonth>30){S.dayOfMonth=1;S.month++;if(S.month>12)S.month=1;let mult=(S.month===7||S.month===12)?2:1;S.money+=SALARY[S.difficulty]*mult;S.mem.push('給料日：'+yen(SALARY[S.difficulty]*mult)+' 入金')}chapterCalc();if(S.visits>=96)checkEnding()}
function skipDay(){S.history.push({day:S.day,type:'skip'});for(const id of working())S.flags['absence_'+id]=(S.flags['absence_'+id]||0)+1;S.mem.push('DAY '+S.day+'：BLACK RABBITには行かなかった');advanceDay();save();render()}
function renderSNS(){page('sns');let posts=Object.keys(CHARS).map(id=>{let replied=S.snsReplied[id+'_'+S.day];return `<div class="panel sns"><b>${CHARS[id].name}</b><p>${snsText(id)}</p>${replied?`<div class="notice">あなた：${esc(replied)}<br><b>${CHARS[id].name}：</b>${snsReply(id)}</div>`:`<div class="choices"><button class="btn" onclick="replySNS('${id}','今日もおつかれ！')">今日もおつかれ！</button><button class="btn" onclick="replySNS('${id}','次の出勤も楽しみにしてる')">次の出勤も楽しみにしてる</button></div>`}</div>`}).join('');document.getElementById('sns').innerHTML=`<div class="sectionTitle">SNS</div>${posts}<button class="btn ghost" onclick="renderHome()">戻る</button>`}
function snsText(id){return {shio:'今日もお給仕おわった〜ちゃむ。来てくれた人ありがとう♡',kome:'今日もいっぱい笑った〜！みんなありがとう笑',suzu:'次のお給仕、ちゃんと来てくれる？',nia:'今日の何気ない会話、なんか覚えてる。'}[id]}
function snsReply(id){return {shio:'ありがとう。そういう一言、うれしいちゃむ。',kome:'ありがと笑 またいっぱい話そ〜！',suzu:'……じゃあ、忘れないで。',nia:'ふふ。次会った時も覚えててな。'}[id]}
function replySNS(id,t){let k=id+'_'+S.day;if(S.snsReplied[k])return;S.snsReplied[k]=t;S.rel[id].aff=Math.min(100,S.rel[id].aff+1);S.mem.push('SNSで'+CHARS[id].name+'に「'+t+'」と送った');save();renderSNS()}
function specialEvent(){let md=String(S.month).padStart(2,'0')+'-'+String(S.dayOfMonth).padStart(2,'0');let id=Object.keys(BDAY).find(k=>BDAY[k]===md);if(id)return CHARS[id].name+'の誕生日';if(md==='12-25')return 'クリスマス';return null}
function openMenu(){document.getElementById('menu').classList.add('show');let ev=specialEvent();document.getElementById('menuBody').innerHTML=`<p class="muted">${esc(S.name)} / DAY ${S.day} / ${yen(S.money)}</p><div class="notice">現在：CHAPTER ${S.chapter}<br>特別日：${ev||'なし'}</div><div class="choices"><button class="btn" onclick="showMemory()">思い出を見る</button><button class="btn" onclick="manualSave()">セーブ</button><button class="btn" onclick="exportSave()">セーブデータを書き出す</button>${ev?`<button class="btn" onclick="giftEvent()">プレゼントを買う</button>`:''}<button class="btn ghost" onclick="resetGame()">最初から</button></div>`}
function closeMenu(){document.getElementById('menu').classList.remove('show')}
function manualSave(){save();toast('セーブしました')}
function showMemory(){let txt=S.mem.slice(-30).reverse().map(x=>'<p>'+esc(x)+'</p>').join('')||'<p class="muted">まだ思い出はありません。</p>';document.getElementById('menu').classList.add('show');document.getElementById('menuBody').innerHTML=`<div class="sectionTitle">思い出</div><div class="log">${txt}</div><button class="btn ghost" onclick="closeMenu()">閉じる</button>`}
function showLog(){let txt=(convo?.lines||[]).map(x=>`<p><b>${esc(S.name)}：</b>${esc(x.player)}<br><b>${CHARS[convo.id].name}：</b>${esc(x.reaction)}</p>`).join('')||'<p class="muted">まだ会話はありません。</p>';document.getElementById('menu').classList.add('show');document.getElementById('menuBody').innerHTML=`<div class="sectionTitle">会話ログ</div><div class="log">${txt}</div><button class="btn ghost" onclick="closeMenu()">閉じる</button>`}
function giftEvent(){let ev=specialEvent();if(!ev)return toast('今日はプレゼントを買える特別日ではありません');let id=Object.keys(BDAY).find(k=>CHARS[k].name&&ev.startsWith(CHARS[k].name));if(!id)id=S.lastTalk||'shio';if(S.money<5000)return toast('プレゼント代が足りません');let k=S.month+'-'+S.dayOfMonth+'-'+id;if(S.gifted[k])return toast('今日はもうプレゼントを渡しました');S.money-=5000;S.gifted[k]=true;S.rel[id].aff=Math.min(100,S.rel[id].aff+5);S.rel[id].trust=Math.min(100,S.rel[id].trust+3);S.mem.push(ev+'：'+CHARS[id].name+'にプレゼントを渡した');save();closeMenu();render();toast('プレゼントを用意しました')}
function exportSave(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BLACK_RABBIT_V75_SAVE.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resetGame(){if(confirm('セーブデータを消して最初から始めますか？')){localStorage.removeItem(KEY);S=fresh();closeMenu();render()}}
function checkEnding(){let arr=Object.keys(CHARS).map(id=>[id,S.rel[id].aff+S.rel[id].trust]).sort((a,b)=>b[1]-a[1]);let top=arr[0],second=arr[1];if(top[1]>=150&&top[1]-second[1]>=20)S.ending=CHARS[top[0]].name+' — 大切な人';else if(top[1]>=125&&top[1]-second[1]<20)S.ending='交差する想い';else if(top[1]>=95)S.ending='BLACK RABBIT — 帰る場所';else S.ending='また、いつか';S.ended=true;save()}
function renderEnding(){page('ending');document.getElementById('ending').innerHTML=`<div class="panel ending"><span class="tag">ENDING</span><h1>${esc(S.ending||'BLACK RABBIT')}</h1><p>最初は、たまたま見つけただけの店だった。</p><p>扉の向こうから聞こえた言葉は――</p><h2 style="color:var(--pink2);margin:28px 0">「おかえり」</h2><button class="btn primary" onclick="resetGame()">もう一度はじめる</button></div>`}
function toast(t){let n=document.createElement('div');n.textContent=t;n.style='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;background:#2b1727;border:1px solid #a05b80;color:white;padding:10px 14px;border-radius:999px;font-weight:800';document.body.appendChild(n);setTimeout(()=>n.remove(),1800)}
window.addEventListener('error',e=>{console.error(e.error||e.message);toast('一時的なエラーを復旧しました');try{save();render()}catch(_){}});
safeLoad();render();
</script></body></html>

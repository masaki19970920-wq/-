<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BLACK RABBIT STEP3 Ver.1.0</title><style>
:root{--bg:#09090c;--panel:#15151b;--text:#f7f7fb;--muted:#aaaab5;--accent:#e34b64;--line:#30303a;--gold:#d7b36a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#29151d,#09090c 42%,#050507);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{width:min(100%,480px);min-height:100dvh;margin:auto;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);background:#08080bcc}.screen{display:none;min-height:100dvh;padding:28px 0}.screen.active{display:flex;flex-direction:column}.logo{font-size:40px;font-weight:900;letter-spacing:.08em}.center{margin:auto 0;text-align:center}.sub,.muted{color:var(--muted)}.btn{width:100%;border:1px solid var(--line);background:#18181f;color:#fff;border-radius:14px;padding:14px;margin:5px 0;font-size:16px}.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:800}.btn.danger{border-color:#803344}.btn:disabled{opacity:.35}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.head{font-size:24px;font-weight:850}.story{font-size:16px;line-height:1.9;white-space:pre-line}.date{color:#e2b0ba;font-size:14px}.money{font-size:23px;font-weight:850}.row{display:flex;gap:8px}.row>*{flex:1}input,select{width:100%;background:#0e0e13;color:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:16px}.label{font-size:13px;color:var(--muted);margin:10px 0 5px}.cast{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{display:inline-block;background:#27272f;border-radius:999px;padding:4px 8px;font-size:12px;color:#ddd}.choice{text-align:left;background:#101016}.sep{border:0;border-top:1px solid var(--line);margin:12px 0}.tiny{font-size:12px;color:var(--muted)}.spacer{flex:1}.toast{position:fixed;z-index:10;left:50%;bottom:28px;transform:translateX(-50%);background:#fff;color:#111;padding:9px 15px;border-radius:999px;display:none;white-space:nowrap}.gold{color:var(--gold)}
</style></head><body><main class="app">
<section id="title" class="screen active"><div class="center"><div class="logo">BLACK RABBIT</div><div class="sub">STEP 3 Prototype Ver.1.0</div><button class="btn primary" onclick="newGame()">NEW GAME</button><button id="continueBtn" class="btn" onclick="continueGame()">CONTINUE</button><button class="btn" onclick="showSettings()">SETTINGS</button></div></section>
<section id="setup" class="screen"><div class="head">PLAYER DATA</div><div class="card"><div class="label">名前</div><input id="pname" maxlength="10" placeholder="名前"><div class="label">誕生日</div><div class="row"><select id="bmonth"></select><select id="bday"></select></div><div class="label">難易度</div><select id="difficulty"><option value="EASY">EASY — ¥300,000</option><option value="NORMAL" selected>NORMAL — ¥150,000</option><option value="HARD">HARD — ¥60,000</option><option value="EXTREME">EXTREME — ¥15,000</option></select></div><button class="btn primary" onclick="startGame()">この設定で始める</button><button class="btn" onclick="go('title')">戻る</button></section>
<section id="story" class="screen"><div id="storyDate" class="date"></div><div id="storyText" class="card story"></div><div id="storyChoices"></div></section>
<section id="home" class="screen"><div class="date" id="homeDate"></div><div class="head">HOME</div><div class="card"><div class="tiny">所持金</div><div class="money" id="homeMoney"></div><hr class="sep"><div class="tiny">本日の出勤</div><div id="homeCast"></div></div><button class="btn primary" onclick="enterShop()">BLACK RABBITへ行く</button><div class="row"><button class="btn" onclick="placeholder('カレンダー')">カレンダー</button><button class="btn" onclick="placeholder('SNS')">SNS</button></div><div class="row"><button class="btn" onclick="placeholder('アルバム')">アルバム</button><button class="btn" onclick="go('save')">セーブ・ロード</button></div><button class="btn" onclick="restDay()">今日は休む</button></section>
<section id="shop" class="screen"><div class="date" id="shopDate"></div><div class="head">BLACK RABBIT</div><div class="card story" id="shopGreeting"></div><div id="castList"></div><div class="spacer"></div><button class="btn danger" onclick="leaveConfirm()">店を出る</button></section>
<section id="order" class="screen"><div class="head" id="orderHead">ORDER</div><div class="card"><div class="tiny">所持金 <span id="orderMoney"></span></div><div id="menuList"></div><hr class="sep"><div>合計 <b id="cartTotal">¥0</b></div></div><button class="btn primary" onclick="confirmOrder()">注文する</button><button class="btn" onclick="go('shop')">戻る</button></section>
<section id="talk" class="screen"><div class="date" id="talkName"></div><div id="talkText" class="card story"></div><div id="talkChoices"></div></section>
<section id="result" class="screen"><div class="head">TODAY'S MEMORY</div><div id="resultBody" class="card story"></div><button class="btn primary" onclick="finishDay()">次の日へ</button></section>
<section id="save" class="screen"><div class="head">SAVE / LOAD</div><div class="card"><button class="btn primary" onclick="manualSave()">手動セーブ</button><button class="btn" onclick="manualLoad()">手動ロード</button><div class="tiny" id="saveInfo"></div></div><button class="btn" onclick="go('home')">戻る</button></section>
<section id="settings" class="screen"><div class="head">SETTINGS</div><div class="card"><div class="label">SE音量</div><input id="seVol" type="range" min="0" max="1" step="0.1" value="0.6"><div class="label">テキスト速度</div><select id="textSpeed"><option>標準</option><option>速い</option><option>瞬間</option></select></div><button class="btn" onclick="go('title')">戻る</button></section>
</main><div id="toast" class="toast"></div><script>
const SAVE_VERSION=3, AUTO='br_step3_auto', MANUAL='br_step3_manual';
const CHARS={shio:{name:'しおち',days:[1,3,5,6]},kome:{name:'こめ',days:[0,2,3,4,6]},suzu:{name:'スズ',days:[1,2,3,5,6]},niatama:{name:'にあたま',days:[0,2,4,5,6]}}; // 0=月
const MENU=[['drink','ドリンク',1000],['cheki','チェキ',1000],['can','オリ缶',3000],['champagne','シャンパン',10000],['original','オリシャン',30000],['mini','ミニ制服オリシャン',100000]];
const DIFF={EASY:300000,NORMAL:150000,HARD:60000,EXTREME:15000};
let state=null, selectedCast=null, cart={}, talkStage=0;
function baseState(){let rel={};Object.keys(CHARS).forEach(k=>rel[k]={affection:0,trust:0,jealousy:0,lastTalkDay:null,talkCount:0});return{saveVersion:SAVE_VERSION,player:{name:'',birthday:{m:1,d:1},difficulty:'NORMAL',traits:{}},day:0,money:150000,rel,memories:{},orders:[],visits:[],promises:[],suspicion:0,today:{talked:[],orders:[],spent:0},screen:'home',salaryKeys:[]}}
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(state){state.screen=id;if(id==='home')renderHome();if(id==='shop')renderShop();if(id==='save')renderSaveInfo()}}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1500)}
function yen(n){return '¥'+n.toLocaleString('ja-JP')}
function gameDate(){let base=new Date(2031,3,1);base.setDate(base.getDate()+state.day);return base}
function dateText(){let d=gameDate(), w='日月火水木金土'[d.getDay()];return `${d.getMonth()+1}月${d.getDate()}日（${w}）`}
function working(){let d=gameDate(), map=[6,0,1,2,3,4,5],idx=map[d.getDay()];return Object.keys(CHARS).filter(k=>CHARS[k].days.includes(idx))}
function saveAuto(){localStorage.setItem(AUTO,JSON.stringify(state));updateContinue()}
function migrate(x){if(!x)return null;x.saveVersion=SAVED_VERSION_SAFE(x.saveVersion);x.today??={talked:[],orders:[],spent:0};x.salaryKeys??=[];return x} function SAVED_VERSION_SAFE(){return SAVE_VERSION}
function updateContinue(){document.getElementById('continueBtn').disabled=!localStorage.getItem(AUTO)}
function newGame(){state=baseState();go('setup')}
function continueGame(){let x=localStorage.getItem(AUTO);if(!x)return;state=migrate(JSON.parse(x));go(state.screen==='title'?'home':state.screen);if(state.screen==='shop')renderShop()}
function startGame(){let n=document.getElementById('pname').value.trim();if(!n){toast('名前を入力してね');return}state=baseState();state.player.name=n;state.player.birthday={m:+bmonth.value,d:+bday.value};state.player.difficulty=difficulty.value;state.money=DIFF[state.player.difficulty];state.screen='story';saveAuto();prologue1()}
function story(text,choices){go('story');storyDate.textContent='4月1日（水）';storyText.textContent=text;storyChoices.innerHTML='';choices.forEach(([label,fn])=>{let b=document.createElement('button');b.className='btn choice';b.textContent=label;b.onclick=fn;storyChoices.appendChild(b)})}
function prologue1(){story('大阪・心斎橋。\n雨上がりのアスファルトに、街の灯りが滲んでいる。\n\nふと、ビルの中に「BLACK RABBIT」という看板を見つけた。',[['入ってみる',()=>prologueEnter('active')],['ちょっと怪しいな……',()=>prologueEnter('cautious')],['一回通り過ぎる',()=>prologueEnter('hesitant')]])}
function prologueEnter(trait){state.player.traits[trait]=(state.player.traits[trait]||0)+1;story('エレベーターに乗り、上の階へ。\n\n――チン♪\n\n扉が開く。\n「いらっしゃいませ〜！」\n\n初めて見る、小さな店だった。',[['店内を見る',prologueCast]])}
function prologueCast(){let ws=working();story('今日いるキャストがこちらを見ている。\n最初に誰と話そう？',ws.map(k=>[CHARS[k].name,()=>firstTalk(k)]))}
function firstTalk(k){selectedCast=k;let c=CHARS[k].name;let intro=k==='kome'?'初めまして！こめです。こういう店、来たことある？':k==='suzu'?'こんばんは、スズです。初めてだよね？':k==='niatama'?'初めまして、にあたまです。ふらっと来てくれた感じ？':'初めまして〜！しおちです。';story(`${c}「こんばんは。初めまして！」\n\n${intro}\n\n最初の一杯として、ドリンクを注文することになった。`,[['こういう店は初めて',()=>firstChoice('first')],['たまに行く',()=>firstChoice('sometimes')],['気になって入ってみた',()=>firstChoice('curious')]])}
function firstChoice(v){state.memories.firstCast=selectedCast;state.memories.firstShopAnswer=v;state.money-=1000;state.orders.push({day:0,cast:selectedCast,item:'drink',qty:1,total:1000});state.visits.push({day:0,cast:[selectedCast]});state.rel[selectedCast].talkCount++;state.rel[selectedCast].trust++;story(`${CHARS[selectedCast].name}「そっか。来てくれてありがとう。」\n\nしばらく話したあと、帰る時間になった。\n\n「また近く来たら寄ってね。」\n\n――チン♪\nエレベーターの扉が開く。\n\n約束したわけじゃない。\nそれでも、“BLACK RABBIT”という名前が少しだけ頭に残った。`,[['次の日へ',()=>{state.day=1;state.today={talked:[],orders:[],spent:0};state.screen='home';saveAuto();go('home')} ]])}
function renderHome(){homeDate.textContent=dateText();homeMoney.textContent=yen(state.money);homeCast.innerHTML=working().map(k=>`<span class="tag">${CHARS[k].name}</span>`).join(' ')}
function enterShop(){state.today??={talked:[],orders:[],spent:0};go('shop');renderShop()}
function renderShop(){shopDate.textContent=dateText();let first=state.memories.firstCast, fast=state.day===1&&working().includes(first);shopGreeting.textContent=`――チン♪\nエレベーターの扉が開く。\n${fast?CHARS[first].name+'「あれ！？ '+state.player.name+'くん、ほんまにまた来たんや笑」':'「いらっしゃいませ〜！」'}`;castList.innerHTML='';working().forEach(k=>{let done=state.today.talked.includes(k);let div=document.createElement('div');div.className='card cast';div.innerHTML=`<div><b>${CHARS[k].name}</b><div class="tiny">${done?'✓ 会話済み':'話せます'}</div></div>`;let b=document.createElement('button');b.className='btn';b.style.width='120px';b.textContent=done?'会話済み':'話す';b.disabled=done;b.onclick=()=>openOrder(k);div.appendChild(b);castList.appendChild(div)})}
function openOrder(k){selectedCast=k;cart={};orderHead.textContent=`${CHARS[k].name}に注文`;orderMoney.textContent=yen(state.money);menuList.innerHTML='';MENU.forEach(([id,n,p])=>{let d=document.createElement('div');d.className='cast';d.innerHTML=`<div>${n}<div class="tiny">${yen(p)}</div></div><div class="row" style="flex:0 0 145px"><button class="btn" onclick="chg('${id}',-1)">−</button><span id="q_${id}" style="align-self:center;text-align:center">0</span><button class="btn" onclick="chg('${id}',1)">＋</button></div>`;menuList.appendChild(d)});updateCart();go('order')}
function chg(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);document.getElementById('q_'+id).textContent=cart[id];updateCart()}
function total(){return MENU.reduce((s,[id,,p])=>s+(cart[id]||0)*p,0)} function updateCart(){cartTotal.textContent=yen(total())}
function confirmOrder(){let t=total();if(t<=0){toast('何か注文してね');return}if(t>state.money){toast('所持金が足りない');return}state.money-=t;let items=[];MENU.forEach(([id,n,p])=>{if(cart[id])items.push({id,name:n,qty:cart[id],price:p})});let rec={day:state.day,cast:selectedCast,items,total:t};state.orders.push(rec);state.today.orders.push(rec);state.today.spent+=t;startTalk()}
const TALK={shio:[['しおち「今日も来てくれたんや。ちゃむ〜笑」','今日は会いたかった','近くまで来たから','なんとなく'],['しおち「こういうお店、もう慣れた？」','だいぶ慣れた','まだちょっと緊張する','しおちのおかげかも']],kome:[['こめ「お、今日も来たな〜笑」','会いに来た','暇だったから','店が気になって'],['こめ「うちって話しやすい？」','めっちゃ話しやすい','まだ探り探り','面白い人だと思う']],suzu:[['スズ「こんばんは。今日はどうしたの？」','スズと話したくて','ふらっと来た','飲みに来た'],['スズ「意外とちゃんと来るんだね」','約束は守るタイプ','気分次第かな','そう見えなかった？']],niatama:[['にあたま「また会ったね。今日は何話す？」','にあたまの話を聞きたい','最近のこと','大橋くんの話とか？'],['にあたま「前より店に馴染んできたね笑」','そうかも','まだ緊張する','いい加減にして笑']]};
function startTalk(){talkStage=0;renderTalk()}
function renderTalk(){go('talk');talkName.textContent=CHARS[selectedCast].name;let arr=TALK[selectedCast][talkStage%TALK[selectedCast].length];talkText.textContent=arr[0];talkChoices.innerHTML='';arr.slice(1).forEach((x,i)=>{let b=document.createElement('button');b.className='btn choice';b.textContent=x;b.onclick=()=>chooseTalk(i,x);talkChoices.appendChild(b)})}
function chooseTalk(i,label){state.memories[`talk_${selectedCast}_${state.day}_${talkStage}`]=label;let r=state.rel[selectedCast];r.affection+=i===0?2:1;r.trust+=i===2?1:0;if(talkStage===0){talkStage++;renderTalk();return}r.talkCount++;r.lastTalkDay=state.day;state.today.talked.push(selectedCast);talkText.textContent=`${CHARS[selectedCast].name}「今日は話せてよかった。またね。」`;talkChoices.innerHTML='<button class="btn primary" onclick="go(\'shop\')">店内に戻る</button>';saveAuto()}
function leaveConfirm(){if(confirm('今日は店を出る？'))leaveShop()}
function leaveShop(){let eligible=state.today.talked.filter(k=>state.rel[k].affection>=8);if(eligible.length&&Math.random()<.18){let k=eligible.sort((a,b)=>state.rel[b].affection-state.rel[a].affection)[0];if(confirm(`――チン♪\n${CHARS[k].name}「……もう帰るん？」\n\nもう少し残る？`)){state.rel[k].affection+=2;state.memories['stay_'+state.day]=k;toast('少しだけ、特別な時間を過ごした。')}}showResult()}
function showResult(){go('result');let names=state.today.talked.map(k=>CHARS[k].name).join('・')||'なし';resultBody.textContent=`${dateText()}\n話したキャスト：${names}\n本日の注文額：${yen(state.today.spent)}\n\n――チン♪\nエレベーターで店をあとにした。`}
function finishDay(){state.visits.push({day:state.day,cast:[...state.today.talked]});state.day++;state.today={talked:[],orders:[],spent:0};processNewDay();state.screen='home';saveAuto();go('home')}
function restDay(){if(!confirm('今日は休む？'))return;state.day++;state.today={talked:[],orders:[],spent:0};processNewDay();state.screen='home';saveAuto();go('home')}
function processNewDay(){let d=gameDate();if(d.getDate()===1){let key=`${d.getFullYear()}-${d.getMonth()+1}`;if(!state.salaryKeys.includes(key)){let base=DIFF[state.player.difficulty],bonus=[6,11].includes(d.getMonth())?2:1;state.money+=base*bonus;state.salaryKeys.push(key);state.memories['salary_'+key]=base*bonus}}}
function manualSave(){localStorage.setItem(MANUAL,JSON.stringify(state));renderSaveInfo();toast('セーブしました')}
function manualLoad(){let x=localStorage.getItem(MANUAL);if(!x){toast('セーブデータがないよ');return}state=migrate(JSON.parse(x));toast('ロードしました');go('home')}
function renderSaveInfo(){let x=localStorage.getItem(MANUAL);saveInfo.textContent=x?'手動セーブデータあり':'手動セーブデータなし'}
function placeholder(n){toast(`${n}はSTEP 4以降で本格実装`)} function showSettings(){go('settings')}
for(let m=1;m<=12;m++)bmonth.add(new Option(m+'月',m));function fillDays(){let m=+bmonth.value||1,max=new Date(2028,m,0).getDate(),v=+bday.value||1;bday.innerHTML='';for(let d=1;d<=max;d++)bday.add(new Option(d+'日',d));bday.value=Math.min(v,max)}bmonth.onchange=fillDays;bmonth.value=9;fillDays();bday.value=20;updateContinue();
</script></body></html>
